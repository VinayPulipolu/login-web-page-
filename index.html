<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(119, 111, 255, .12), transparent 34%),
        radial-gradient(ellipse at 88% 90%, rgba(57, 178, 156, .10), transparent 32%),
        #f5f7fb;
    }

    .login-card {
      width: min(100%, 430px);
      padding: 42px;
      border: 1px solid rgba(226, 231, 240, .9);
      border-radius: 22px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 24px 70px rgba(31, 43, 73, .10);
    }

    .brand {
      display: inline-grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(140deg, #7770f5, #574de0);
      box-shadow: 0 8px 18px rgba(97, 87, 231, .28);
      font-size: 21px;
      font-weight: 750;
    }

    h1 {
      margin: 26px 0 8px;
      font-size: clamp(1.7rem, 5vw, 2rem);
      letter-spacing: -.045em;
    }

    .intro {
      margin: 0 0 30px;
      color: #697386;
      line-height: 1.6;
      font-size: .96rem;
    }

    .field { margin-bottom: 19px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: .88rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 0 14px;
      border: 1px solid #dce2ec;
      border-radius: 10px;
      outline: none;
      color: #172033;
      background: #fff;
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    input::placeholder { color: #9aa3b2; }

    input:focus {
      border-color: #7269ed;
      box-shadow: 0 0 0 4px rgba(114, 105, 237, .13);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 3px 0 24px;
      font-size: .85rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #596477;
    }

    .remember input {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: #655ce8;
    }

    a {
      color: #5d54dc;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(100deg, #6d64ed, #584fe0);
      box-shadow: 0 9px 18px rgba(97, 87, 231, .2);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(97, 87, 231, .28);
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(114, 105, 237, .45);
      outline-offset: 3px;
    }

    .signup {
      margin: 24px 0 0;
      color: #697386;
      text-align: center;
      font-size: .9rem;
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand" aria-hidden="true">L</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to your account to continue.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>

      <div class="options">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#" id="forgot-password">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
    </form>

    <p class="signup">Don't have an account? <a href="#" id="create-account">Create one</a></p>
  </main>

  <script>
    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      if (!this.reportValidity()) return;
      alert("Successfully logged in!");
    });

    document.getElementById("forgot-password").addEventListener("click", function (event) {
      event.preventDefault();
      alert("Please contact support to reset your password.");
    });

    document.getElementById("create-account").addEventListener("click", function (event) {
      event.preventDefault();
      alert("Account registration is not available in this demo.");
    });
  </script>
</body>
</html>
